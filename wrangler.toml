name = "docket"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Only reachable at docket.onthehouse.club, behind Cloudflare Access.
workers_dev = false
preview_urls = false
routes = [{ pattern = "docket.onthehouse.club", custom_domain = true }]

# Secrets are set in the Cloudflare dashboard and survive every deploy:
#   TODOIST_TOKEN, ACCESS_TEAM_DOMAIN, ACCESS_AUD
keep_vars = true

[vars]
ALLOWED_EMAILS = "mark@bradley.work"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Temp-task storage. No id: Cloudflare creates the namespace in this
# account on the first deploy and reuses it afterwards.
[[kv_namespaces]]
binding = "DOCKET"
