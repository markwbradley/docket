name = "docket"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Only reachable at docket.onthehouse.club, behind Cloudflare Access.
workers_dev = false
preview_urls = false
routes = [{ pattern = "docket.onthehouse.club", custom_domain = true }]

# Secrets are set in the Cloudflare dashboard and survive every deploy:
#   TODOIST_TOKEN, ACCESS_TEAM_DOMAIN, ACCESS_AUD
keep_vars = true

[vars]
ALLOWED_EMAILS = "mark@bradley.work"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Where each day's own data lived until v4.0. Kept so the Durable Object
# can bring a day across the first time it is opened.
[[kv_namespaces]]
binding = "DOCKET"

# Each day's own data (temp tasks, padlocks, ticked-off list), from v4.0.
# One object handles one request at a time, so saves from two devices
# merge instead of overwriting each other.
[[durable_objects.bindings]]
name = "DAYS"
class_name = "DayStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DayStore"]
